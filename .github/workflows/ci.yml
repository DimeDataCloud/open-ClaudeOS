name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-reference:
    name: Python reference (Phase 0)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  core:
    name: Core (.NET) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ClaudeOS.slnx -c Release
      - run: dotnet test tests/ClaudeOS.Core.Tests -c Release --no-build

  design:
    name: Design tokens and prototype data are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # tokens.json is the single source: CSS, XAML and C# are generated from it.
      - run: node design/build-tokens.mjs --check
      # The prototype is driven by output of the real core; regenerating must change nothing.
      - run: dotnet run --project windows/src/ClaudeOS.Cli -c Release -- demo-data
      - run: git diff --exit-code design/prototype/data.js
